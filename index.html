<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الحيكي ميكي</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- براويز القهوة -->

  <div class="wall-gallery" aria-label="براويز القهوة">

    <img
      class="sign sign-1"
      src="images/sign-brain.jpg"
      alt="رجاء رج المخ جيدًا قبل الكلام"
    >

    <img
      class="sign sign-2"
      src="images/sign-dance.jpg"
      alt="عملتها الرقص هزت لغيري"
    >

    <img
      class="sign sign-3"
      src="images/sign-where.jpg"
      alt="كنت فين يا لأ لما أنا قلت آه"
    >

  </div>


  <!-- الصفحة الرئيسية -->

  <main class="hero">


    <!-- الكارت -->

    <section class="content">

      <p class="welcome">
        أهلًا بيك في
      </p>

      <h1>
        الحيكي ميكي 😂
      </h1>

      <p class="description">
        موقع تعارف مصري على رواقة ☕
      </p>

      <button type="button">
        ابدأ التعارف
      </button>


      <!-- الست تحت زر ابدأ التعارف -->

      <img
        class="woman"
        src="images/woman.png.png"
        alt="الست"
      >

    </section>


    <!-- الراجل -->

    <aside class="character">

      <img
        class="man"
        src="images/heiky-meiky-final.png"
        alt="شخصية الحيكي ميكي"
      >

    </aside>

  </main>

</body>

</html>
