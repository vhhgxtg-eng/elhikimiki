<body>

  <div class="home-flies" aria-hidden="true"><span class="home-fly home-fly-1"><img src="images/real-fly.png" alt=""></span><span class="home-fly home-fly-2"><img src="images/real-fly.png" alt=""></span><span class="home-fly home-fly-3"><img src="images/real-fly.png" alt=""></span></div>

  <!-- يافطات القهوة -->

  <!-- الصفحة الرئيسية -->
  <main class="hero">


    <!-- الكارت -->
    <section class="content">

      </p>


      <!-- العنوان -->
      <h1 class="main-title">

        <span class="landing-word landing-word-1">الحيكي</span>
        <span class="landing-word landing-word-2">ميكي</span>

        <img
          class="title-emoji"
          src="images/wave-emoji.png"
          alt=""
        >

      </h1>


      <!-- الوصف -->
      <p class="description">
        شات مصري ع الرايق ☕
      </p>

      <div class="cafe-live" aria-live="polite">
        <span id="daily-saying">جملة القهوة النهارده: خليك رايق… البن بيتحمّص</span>
        <b id="cafe-count">بنشوف مين في القهوة…</b>
      </div>


      <!-- الزر -->
      <button type="button" onclick="window.location.href='chat.html'">
        ابدأ التعارف
      </button>

    </section>


    <!-- الراجل والست -->
    <img
      class="couple-sitting"
      src="images/couple-sitting.png.png"
      alt="الحيكي الميكي للهلس والهشك بشك"
    >


    <!-- القطة النايمة -->
    <div class="sleeping-cat" role="button" tabindex="0" aria-label="صحّي القطة">

      <span class="cat-speech" role="status" aria-live="polite" hidden></span>

      <div class="cat-art">

        <img
          class="cat-body"
          width="600"
          height="400"
          src="images/sleeping-cat-web.png"
          alt="قطة نايمة"
        >

        <img class="cat-angry-face" src="angry-cat-eyes.png" alt="" aria-hidden="true" width="1536" height="1024">
        <span class="snore snore-1" aria-hidden="true">Z</span>

        <span class="snore snore-2" aria-hidden="true">Z</span>

        <span class="snore snore-3" aria-hidden="true">Z</span>

      </div>

    </div>


  </main>


  <script>
    const dailySayings = [
      'خليك رايق… البن بيتحمّص',
      'الكلام ببلاش، بس اختار كلامك',
      'فنجان مظبوط وقعدة من غير تكليف',
      'اللي جاي يقعد… يسيب الهم ع الباب',
      'قول أهلًا، يمكن القعدة تحلو',
      'النهارده للضحك… بكرة نشوف',
      'متستعجلش، القهوة لسه سخنة'
    ];
    const dayNumber = Math.floor(Date.now() / 86400000);
    document.getElementById('daily-saying').textContent = `جملة القهوة النهارده: ${dailySayings[dayNumber % dailySayings.length]}`;
    const statsUrl = location.hostname.endsWith('github.io')
      ? 'https://elhikimiki-chat.amiraelghanam101.chatgpt.site/api/stats'
      : '/api/stats';
    fetch(statsUrl, { cache: 'no-store' }).then(response => response.json()).then(({ active }) => {
      document.getElementById('cafe-count').textContent = active ? `في القهوة دلوقتي: ${active}` : 'أول كرسي مستنيك';
    }).catch(() => { document.getElementById('cafe-count').textContent = 'القهوة مفتوحة'; });

    const cat = document.querySelector('.sleeping-cat');
    const catSpeech = cat.querySelector('.cat-speech');
    let catSleepTimer;

    function sleepCat() {
      clearTimeout(catSleepTimer);
      cat.classList.remove('is-angry');
      catSpeech.hidden = true;
      catSpeech.textContent = '';
    }

    function wakeCat() {
      if (cat.classList.contains('is-angry')) return;
      cat.classList.add('is-angry');
      catSpeech.innerHTML = '<strong>سبني انام</strong><span>دا انت رخم</span>';
      catSpeech.hidden = false;
      catSleepTimer = setTimeout(sleepCat, 3000);
    }

    catSpeech.addEventListener('animationend', sleepCat);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) sleepCat();
    });

    cat.addEventListener('click', wakeCat);
    cat.addEventListener('keydown', (event) => {
      if (!event.repeat && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        wakeCat();
      }
    });
  </script>
</body>
