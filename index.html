<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- SEO -->
  <title>الحيكي الميكي للهلس والهشك بشك | موقع تعارف مصري</title>

  <meta
    name="description"
    content="الحيكي الميكي للهلس والهشك بشك - موقع تعارف مصري كوميدي على رواقة. ادخل عالم الحيكي ميكي واتعرف وهلس واضحك."
  >

  <meta
    name="keywords"
    content="الحيكي الميكي, الحيكي ميكي, الحيكي الميكي للهلس والهشك بشك, الهلس, الهشك بشك, موقع تعارف مصري"
  >

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YF52NSZL86"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-YF52NSZL86');
  </script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css?v=cat-bubble-4">
</head>


<body>

  <!-- يافطات القهوة -->
  <div class="wall-gallery">

    <img
      class="sign sign-1"
      src="images/sign-brain.jpg"
      alt="رجاء رج المخ جيدًا قبل الكلام"
    >

    <img
      class="sign sign-2"
      src="images/sign-dance.jpg"
      alt="عملتها الرقص هزت لغيري"
    >

    <img
      class="sign sign-3"
      src="images/sign-where.jpg"
      alt="كنت فين يا لأ لما أنا قلت آه"
    >

  </div>


  <!-- الصفحة الرئيسية -->
  <main class="hero">


    <!-- الكارت -->
    <section class="content">

      <p class="welcome">
        أهلًا بيك في
      </p>


      <!-- العنوان -->
      <h1 class="main-title">

        <span>
          الحيكي ميكي
        </span>

        <img
          class="title-emoji"
          src="images/wave-emoji.png"
          alt=""
        >

      </h1>


      <!-- الوصف -->
      <p class="description">
        موقع تعارف مصري على رواقة ☕
      </p>


      <!-- الزر -->
      <button type="button">
        ابدأ التعارف
      </button>

    </section>


    <!-- الراجل والست -->
    <img
      class="couple-sitting"
      src="images/couple-sitting.png.png"
      alt="الحيكي الميكي للهلس والهشك بشك"
    >


    <!-- القطة النايمة -->
    <div class="sleeping-cat" role="button" tabindex="0" aria-label="صحّي القطة">

      <span class="cat-speech" role="status" aria-live="polite" hidden></span>

      <div class="cat-art">

        <img
          class="cat-body"
          width="600"
          height="400"
          src="images/sleeping-cat-web.png"
          alt="قطة نايمة"
        >

        <img class="cat-angry-face" src="angry-cat-eyes.png" alt="" aria-hidden="true" width="1536" height="1024">
        <span class="snore snore-1" aria-hidden="true">Z</span>

        <span class="snore snore-2" aria-hidden="true">Z</span>

        <span class="snore snore-3" aria-hidden="true">Z</span>

      </div>

    </div>


  </main>


  <script>
    const cat = document.querySelector('.sleeping-cat');
    const catSpeech = cat.querySelector('.cat-speech');
    let catSleepTimer;

    function sleepCat() {
      clearTimeout(catSleepTimer);
      cat.classList.remove('is-angry');
      catSpeech.hidden = true;
      catSpeech.textContent = '';
    }

    function wakeCat() {
      if (cat.classList.contains('is-angry')) return;
      cat.classList.add('is-angry');
      catSpeech.innerHTML = '<strong>سبني انام</strong><span>دا انت رخم</span>';
      catSpeech.hidden = false;
      catSleepTimer = setTimeout(sleepCat, 3000);
    }

    catSpeech.addEventListener('animationend', sleepCat);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) sleepCat();
    });

    cat.addEventListener('click', wakeCat);
    cat.addEventListener('keydown', (event) => {
      if (!event.repeat && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        wakeCat();
      }
    });
  </script>
</body>

</html>
