  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script>
    (() => {
      const container = document.getElementById('waving-hand');
      if (!container || !window.lottie || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const makePath = (vertices) => ({
        a: 0,
        k: { i: vertices.map(() => [0, 0]), o: vertices.map(() => [0, 0]), v: vertices, c: true }
      });
      const easing = { i: { x: [0.42], y: [1] }, o: { x: [0.58], y: [0] } };
      const rotations = [
        [0, 0, 0], [14, 0, -18], [24, -18, 20], [34, 20, -20],
        [44, -20, 19], [54, 19, -18], [64, -18, 17], [74, 17, -14],
        [84, -14, 0]
      ].map(([t, s, e], index, frames) => index === frames.length - 1
        ? { t, s: [s] }
        : { t, s: [s], e: [e], ...easing });

      const wave = window.lottie.loadAnimation({
        container,
        renderer: 'svg',
        loop: false,
        autoplay: true,
        animationData: {
          v: '5.12.2', fr: 30, ip: 0, op: 96, w: 220, h: 240, nm: 'waving hand', ddd: 0,
          assets: [],
          layers: [
            {
              ddd: 0, ind: 1, ty: 4, nm: 'baladi sleeve', sr: 1,
              ks: { o: { a: 0, k: 100 }, r: { a: 0, k: 0 }, p: { a: 0, k: [0, 0, 0] }, a: { a: 0, k: [0, 0, 0] }, s: { a: 0, k: [100, 100, 100] } },
              shapes: [{ ty: 'gr', it: [
                { ty: 'sh', ks: makePath([[58,240],[68,144],[151,144],[162,240]]) },
                { ty: 'fl', c: { a: 0, k: [0.95,0.76,0.43,1] }, o: { a: 0, k: 100 } },
                { ty: 'st', c: { a: 0, k: [0.23,0.13,0.09,1] }, o: { a: 0, k: 100 }, w: { a: 0, k: 7 }, lc: 2, lj: 2 },
                { ty: 'sh', ks: makePath([[65,192],[155,192],[155,202],[65,202]]) },
                { ty: 'fl', c: { a: 0, k: [0.71,0.16,0.11,1] }, o: { a: 0, k: 100 } },
                { ty: 'tr', p: { a: 0, k: [0,0] }, a: { a: 0, k: [0,0] }, s: { a: 0, k: [100,100] }, r: { a: 0, k: 0 }, o: { a: 0, k: 100 }, sk: { a: 0, k: 0 }, sa: { a: 0, k: 0 } }
              ]}], ip: 0, op: 96, st: 0, bm: 0
            },
            {
              ddd: 0, ind: 2, ty: 4, nm: 'hand waving from wrist', sr: 1,
              ks: { o: { a: 0, k: 100 }, r: { a: 1, k: rotations }, p: { a: 0, k: [110,184,0] }, a: { a: 0, k: [110,184,0] }, s: { a: 0, k: [100,100,100] } },
              shapes: [{ ty: 'gr', it: [
                { ty: 'sh', ks: makePath([[88,184],[72,164],[64,130],[64,78],[77,78],[77,34],[91,34],[91,83],[91,18],[105,18],[105,83],[105,10],[119,10],[119,85],[119,28],[133,28],[133,106],[150,80],[164,88],[146,142],[133,170],[116,185]]) },
                { ty: 'fl', c: { a: 0, k: [0.78,0.49,0.30,1] }, o: { a: 0, k: 100 } },
                { ty: 'st', c: { a: 0, k: [0.23,0.13,0.09,1] }, o: { a: 0, k: 100 }, w: { a: 0, k: 7 }, lc: 2, lj: 2 },
                { ty: 'el', p: { a: 0, k: [139,122] }, s: { a: 0, k: [25,29] } },
                { ty: 'fl', c: { a: 0, k: [0.71,0.16,0.11,1] }, o: { a: 0, k: 100 } },
                { ty: 'st', c: { a: 0, k: [0.23,0.13,0.09,1] }, o: { a: 0, k: 100 }, w: { a: 0, k: 4 }, lc: 2, lj: 2 },
                { ty: 'el', p: { a: 0, k: [139,122] }, s: { a: 0, k: [10,12] } },
                { ty: 'fl', c: { a: 0, k: [0.95,0.70,0.36,1] }, o: { a: 0, k: 100 } },
                { ty: 'tr', p: { a: 0, k: [0,0] }, a: { a: 0, k: [0,0] }, s: { a: 0, k: [100,100] }, r: { a: 0, k: 0 }, o: { a: 0, k: 100 }, sk: { a: 0, k: 0 }, sa: { a: 0, k: 0 } }
              ]}], ip: 0, op: 96, st: 0, bm: 0
            }
          ]
        }
      });
      wave.addEventListener('complete', () => { container.style.display = 'none'; });
    })();
  </script>
